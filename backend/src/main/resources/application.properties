spring.application.name=backend

#SERVER
server.port=8080
# Tomcat/MVC serves requests; Reactor and WebClient are used only by the feed pipeline.
spring.main.web-application-type=servlet

#DATASOURCE CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#GTFS OVERRIDE
gtfs.stm.override-url=${GTFS_URL_OVERRIDE:}

#REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
# Redis is used for caching only, not for repositories
spring.data.redis.repositories.enabled=false

#APIKEY
stm.api.key=${STM_API_KEY}
stm.api.url=${STM_API_URL}