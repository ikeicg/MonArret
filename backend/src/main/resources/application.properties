spring.application.name=backend

#SERVER
server.port=8080

#DATASOURCE CONFIG
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catchmystm?characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

#R2DBC CONFIG

spring.r2dbc.url=${DB_URL_R2DBC:r2dbc:postgresql://localhost:5432/catchmystm?characterEncoding=UTF-8}
spring.r2dbc.username=${DB_USER:postgres}
spring.r2dbc.password=${DB_PASSWORD:pass}

#HIBERNATE
spring.jpa.hibernate.ddl-auto=validate