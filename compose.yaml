services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: csm-backend

    ports:
      - "80:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GTFS_URL_OVERRIDE: ${GTFS_URL_OVERRIDE}

    depends_on:
      postgis:
        condition: service_healthy

  postgis:
    image: postgis/postgis:18-3.6

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres-data: